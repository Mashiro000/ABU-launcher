name: 插件开发者验收反馈
description: 记录 API 1.1 文档、SDK 和 0.04 Beta 的独立开发问题
title: "[插件开发验收] "
labels: ["plugin-sdk"]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 [独立开发者验收任务](https://github.com/Mashiro000/ABU-launcher/blob/main/docs/PLUGIN_DEVELOPER_ACCEPTANCE.md)。不要公开私钥、Token、密码、完整网络请求头或未脱敏日志。
  - type: input
    id: environment
    attributes:
      label: 测试环境
      description: 操作系统、Node 版本、ABU APK 版本、设备和 Android 版本。
      placeholder: Windows 11 / Node 20 / 0.04 Beta 1 / Samsung Android 15
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: 验收任务
      options:
        - A 多页面设置插件
        - B 双插件协作或媒体插件
        - 官方库投稿与升级
        - SDK 或文档其他问题
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤与预期
      description: 给出文档 URL、执行的命令/界面操作、预期结果。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与已脱敏证据
      description: 附源码仓库或 PR 链接；日志请先删除凭据和个人信息。
    validations:
      required: true
  - type: checkboxes
    id: independent
    attributes:
      label: 独立性确认
      options:
        - label: 我没有参与 ABU 插件 SDK 或宿主实现。
        - label: 我没有阅读 Android 宿主 Kotlin 源码来完成此任务。
